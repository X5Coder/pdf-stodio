<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>PDF Studio — Self Test Fixture</title>
<style>
  body { margin: 0; background: #444; font-family: Tahoma, Arial, sans-serif; }
  .pdf-page { position: relative; background: #fff; color: #111; box-sizing: border-box; padding: 40px; overflow: hidden; }
  h1 { font-size: 28px; margin: 0 0 16px; }
  p { font-size: 16px; margin: 0 0 10px; }
  .tiny { font-size: 6px; }
  .faint { color: #f2f2f2; background: #fff; }
  .overlapA, .overlapB { position: absolute; inset-inline-start: 60px; top: 420px; font-size: 20px; }
  .overlapA { color: #123; }
  .overlapB { color: #456; }
  .fixed { position: fixed; top: 10px; left: 10px; background: #eee; padding: 4px; font-size: 12px; }
</style>
</head>
<body>

<!-- صفحة سليمة المقاس (a4) لكن مليانة مشاكل مقصودة -->
<section class="pdf-page" id="p1" data-page="1" style="width:794px;height:1123px;">
  <h1>صفحة الاختبار الذاتي</h1>
  <p>نص عادي لضمان إن الصفحة مش فاضية، وفيه محتوى كفاية للفحص.</p>

  <!-- صورة مكسورة -->
  <img src="missing-file.png" width="100" height="100" alt="صورة مكسورة">

  <!-- صورة سليمة بدون alt -->
  <img src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==" width="60" height="60">

  <!-- تجاوز حدود الصفحة (أسفل) -->
  <div style="position:absolute; bottom:-120px; inset-inline-start: 40px; width: 200px; height: 60px; background:#c33;">محتوى خارج الصفحة</div>

  <!-- تداخل نصوص -->
  <span class="overlapA">نص متراكب أول</span>
  <span class="overlapB">نص متراكب ثاني</span>

  <!-- تباين ضعيف -->
  <p class="faint">نص لونه فاتح جدًا على أبيض</p>

  <!-- خط صغير جدًا -->
  <p class="tiny">نص بخط 6 بكسل</p>

  <!-- id مكرر -->
  <p id="dup">العنصر الأول بالـ id المكرر</p>
  <p id="dup">العنصر الثاني بالـ id المكرر</p>

  <!-- رابط داخل صفحة PDF -->
  <p><a href="https://example.com">رابط مش هيعمل في الـ PDF</a></p>

  <!-- عنصر fixed -->
  <div class="fixed">fixed</div>
</section>

<!-- صفحة فاضية (a4) -->
<section class="pdf-page" id="p2" data-page="2" style="width:794px;height:1123px;"></section>

<!-- صفحة بمقاس غلط -->
<section class="pdf-page" id="p3" data-page="3" style="width:800px;height:600px;"></section>

</body>
</html>
